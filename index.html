<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報酬シミュレーター｜ミサキカク毎週公演</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#14121a;
  --panel:#1e1b26;
  --panel-2:#262230;
  --rule:#332e40;
  --ink:#efece6;
  --dim:#948da3;
  --gold:#e0b563;
  --gold-soft:#8a6c33;
  --red:#d06b6b;
  --red-soft:#7a3f40;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--stage);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  padding:0 0 64px;
  min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
header{
  padding:28px 0 20px;
  border-bottom:1px solid var(--rule);
  margin-bottom:20px;
}
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--gold);
  font-weight:700;margin-bottom:8px;
}
h1{
  font-family:var(--serif);font-weight:700;
  font-size:26px;line-height:1.35;letter-spacing:.02em;
}
.lede{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.7}

/* ---- section ---- */
section{margin-bottom:24px}
.sec-title{
  font-family:var(--serif);font-size:15px;font-weight:700;
  letter-spacing:.06em;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---- history ---- */
.card{
  background:var(--panel);border:1px solid var(--rule);
  border-radius:14px;padding:16px;
}
.toggle{
  display:flex;align-items:center;gap:12px;
  padding:12px;border-radius:10px;background:var(--panel-2);
  cursor:pointer;user-select:none;
}
.toggle input{
  appearance:none;width:44px;height:26px;border-radius:13px;
  background:var(--rule);position:relative;cursor:pointer;flex:none;
  transition:background .18s;
}
.toggle input::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:var(--dim);transition:transform .18s,background .18s;
}
.toggle input:checked{background:var(--gold-soft)}
.toggle input:checked::after{transform:translateX(18px);background:var(--gold)}
.toggle input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.toggle span{font-size:14px;font-weight:500}

.hist{display:flex;gap:8px;margin-top:14px}
.hist-item{flex:1;text-align:center}
.hist-item label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px}
.hist-item input{
  width:100%;padding:12px 4px;text-align:center;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;
  color:var(--ink);font-family:var(--sans);font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.hist-item input:focus{outline:2px solid var(--gold);outline-offset:1px}
.hist-lead{font-size:12px;color:var(--dim);margin-top:14px}
.hist-note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.6}
.hist-note b{color:var(--gold);font-weight:700}
.reset-btn{
  margin-top:10px;padding:8px 14px;font-size:12px;color:var(--dim);
  background:transparent;border:1px solid var(--rule);border-radius:8px;cursor:pointer;
}
.reset-btn:active{background:var(--panel-2)}
.reset-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hist.disabled{opacity:.35;pointer-events:none}
.best-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.best-row label{flex:1;font-size:13px;font-weight:500;line-height:1.5}
.best-row label span{display:block;font-size:11px;font-weight:400;color:var(--dim)}
.best-row input{
  flex:none;width:84px;padding:10px 4px;text-align:center;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;
  color:var(--ink);font-family:var(--sans);font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.best-row input:focus{outline:2px solid var(--gold);outline-offset:1px}
.best-row.disabled{opacity:.35;pointer-events:none}

/* ---- big input ---- */
.count-box{
  background:var(--panel);border:1px solid var(--rule);
  border-radius:14px;padding:20px 16px 16px;
}
.count-label{font-size:12px;color:var(--dim);letter-spacing:.1em;text-align:center}
.count-display{
  text-align:center;font-weight:900;letter-spacing:-.02em;
  font-size:64px;line-height:1.05;margin:2px 0 4px;
  font-variant-numeric:tabular-nums;
}
.count-display .unit{font-size:20px;font-weight:700;margin-left:4px;color:var(--dim)}
.stepper{display:flex;align-items:center;gap:12px;margin-top:8px}
.step-btn{
  flex:none;width:48px;height:48px;border-radius:50%;
  background:var(--panel-2);border:1px solid var(--rule);color:var(--ink);
  font-size:24px;font-weight:700;cursor:pointer;line-height:1;
}
.step-btn:active{background:var(--rule)}
.step-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slider-wrap{position:relative;flex:1;height:30px;display:flex;align-items:center}
.slider-track{
  position:absolute;left:15px;right:15px;height:6px;
  border-radius:3px;background:var(--gold-soft);
  pointer-events:none;overflow:hidden;
}
.slider-track::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:calc(10 / 40 * 100%);background:var(--red-soft);
}
input[type=range]{
  position:relative;width:100%;appearance:none;
  background:transparent;margin:0;height:30px;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:30px}
input[type=range]::-moz-range-track{background:transparent;height:30px}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--ink);border:3px solid var(--stage);box-shadow:0 0 0 1px var(--rule);
}
input[type=range]::-moz-range-thumb{
  width:30px;height:30px;border-radius:50%;border:3px solid var(--stage);
  background:var(--ink);box-shadow:0 0 0 1px var(--rule);
}
input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.scale{
  position:relative;height:16px;margin:6px 75px 0;
  font-size:10px;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.scale span{
  position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;
}
.scale b{color:var(--gold);font-weight:700}

/* ---- extras ---- */
.extras{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-label{font-size:13px;color:var(--dim)}
.mini{display:flex;align-items:center;gap:8px}
.mini button{
  width:34px;height:34px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--rule);color:var(--ink);font-size:18px;cursor:pointer;line-height:1;
}
.mini button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mini output{
  min-width:36px;text-align:center;font-weight:700;font-size:17px;
  font-variant-numeric:tabular-nums;
}

/* ---- headline result ---- */
.headline{
  border:1px solid var(--gold-soft);border-radius:14px;
  background:linear-gradient(180deg,rgba(224,181,99,.09),rgba(224,181,99,.02));
  padding:18px 16px;text-align:center;margin-bottom:18px;
}
.headline.negative{border-color:var(--red-soft);background:linear-gradient(180deg,rgba(208,107,107,.09),rgba(208,107,107,.02))}
.headline .cap{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.headline .plan{font-family:var(--serif);font-size:15px;font-weight:700;margin-top:6px}
.headline .amt{
  font-size:42px;font-weight:900;line-height:1.1;margin:4px 0 2px;
  font-variant-numeric:tabular-nums;color:var(--gold);
}
.headline.negative .amt{color:var(--red)}
.headline .next{font-size:13px;color:var(--dim);margin-top:8px}
.headline .next b{color:var(--ink);font-weight:700}

/* ---- plan list ---- */
.plan{
  border:1px solid var(--rule);border-radius:12px;
  background:var(--panel);margin-bottom:10px;overflow:hidden;
}
.plan.top{border-color:var(--gold-soft)}
.plan-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;padding:14px 14px 10px;cursor:pointer;
}
.plan-name{font-family:var(--serif);font-size:16px;font-weight:700}
.plan-tag{
  font-size:10px;letter-spacing:.08em;color:var(--stage);background:var(--gold);
  padding:2px 7px;border-radius:99px;margin-left:8px;font-weight:700;vertical-align:2px;
}
.plan-amt{
  font-size:23px;font-weight:900;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--gold);
}
.plan-amt.neg{color:var(--red)}
.bar-track{
  position:relative;height:8px;margin:0 14px 10px;
  background:var(--panel-2);border-radius:4px;overflow:hidden;
}
.bar-zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--dim);opacity:.6;z-index:2}
.bar-fill{position:absolute;top:0;bottom:0;border-radius:2px;transition:left .12s,width .12s}
.bar-fill.pos{background:var(--gold)}
.bar-fill.neg{background:var(--red)}
.plan-sub{
  display:flex;justify-content:space-between;gap:10px;
  padding:0 14px 12px;font-size:12px;color:var(--dim);line-height:1.55;
}
.plan-next{color:var(--gold);font-weight:700;white-space:nowrap}
.plan-next.neg{color:var(--red)}
.detail{
  border-top:1px solid var(--rule);padding:12px 14px;
  background:var(--panel-2);font-size:13px;display:none;
}
.plan.open .detail{display:block}
.detail dl{display:flex;flex-direction:column;gap:6px}
.detail .dl-row{display:flex;justify-content:space-between;gap:12px}
.detail .dl-row span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.detail .dl-row.minus span:last-child{color:var(--red)}
.detail .total{border-top:1px solid var(--rule);margin-top:8px;padding-top:8px}
.detail .memo{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.7}
.detail .memo b{color:var(--ink);font-weight:700}

/* ---- locked ---- */
.locked{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;border:1px dashed var(--rule);border-radius:10px;
  margin-bottom:8px;opacity:.75;
}
.locked .n{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--dim)}
.locked .r{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}

.notice{
  border:1px solid var(--rule);border-left:3px solid var(--gold);
  border-radius:10px;background:var(--panel);
  padding:14px;margin-bottom:16px;font-size:13px;line-height:1.75;
}
.notice .nt{font-family:var(--serif);font-weight:700;font-size:14px;margin-bottom:6px}
.notice p{color:var(--dim)}
.notice b{color:var(--ink);font-weight:700}

footer{
  margin-top:32px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:11px;color:var(--dim);line-height:1.8;
}
@media (min-width:520px){
  h1{font-size:30px}
  .count-display{font-size:76px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">ミサキカク毎週公演</div>
  <h1>報酬シミュレーター</h1>
  <p class="lede">何人お客さまを呼んだら、いくら受け取れるか。<br>スライダーを動かして確かめてください。</p>
</header>

<section>
  <div class="sec-title">これまでの出演</div>
  <div class="card">
    <label class="toggle">
      <input type="checkbox" id="firstTime">
      <span>今回が初めての出演です</span>
    </label>
    <p class="hist-lead">新しい順に、出演した回数だけ左から入れてください。</p>
    <div class="hist" id="histBox">
      <div class="hist-item"><label>前回</label><input type="number" id="h1" min="0" max="60" value="9" inputmode="numeric" placeholder="—"></div>
      <div class="hist-item"><label>2回前</label><input type="number" id="h2" min="0" max="60" value="" inputmode="numeric" placeholder="—"></div>
      <div class="hist-item"><label>3回前</label><input type="number" id="h3" min="0" max="60" value="" inputmode="numeric" placeholder="—"></div>
    </div>
    <div class="best-row" id="bestBox">
      <label for="best">これまでの最高人数<span>（出演4回目以降の方は、任意でご記入ください）</span></label>
      <input type="number" id="best" min="0" max="99" value="" inputmode="numeric" placeholder="—">
    </div>
    <p class="hist-note" id="histNote"></p>
    <button type="button" id="histReset" class="reset-btn">入力をリセット</button>
  </div>
</section>

<section>
  <div class="sec-title">今回の集客</div>
  <div class="count-box">
    <div class="count-label">お客さまの人数</div>
    <div class="count-display"><span id="countTxt">10</span><span class="unit">人</span></div>
    <div class="stepper">
      <button class="step-btn" id="minus" aria-label="1人減らす">−</button>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <input type="range" id="count" min="0" max="40" value="10" aria-label="今回の集客人数">
      </div>
      <button class="step-btn" id="plus" aria-label="1人増やす">＋</button>
    </div>
    <div class="scale">
      <span style="left:0%">0</span>
      <span style="left:25%"><b>10人</b></span>
      <span style="left:50%">20</span>
      <span style="left:75%">30</span>
      <span style="left:100%">40</span>
    </div>

    <div class="extras">
      <div class="row">
        <span class="row-label">ブロマイド販売</span>
        <div class="mini">
          <button id="brMinus" aria-label="ブロマイドを1枚減らす">−</button>
          <output id="brOut">0</output>
          <button id="brPlus" aria-label="ブロマイドを1枚増やす">＋</button>
          <span class="row-label">枚</span>
        </div>
      </div>
      <label class="toggle" style="padding:10px 12px">
        <input type="checkbox" id="team">
        <span>公演全体で50人を達成した</span>
      </label>
    </div>
  </div>
</section>

<section>
  <div id="notice"></div>
  <div id="headline"></div>
  <div class="sec-title">選べるプラン</div>
  <div id="plans"></div>
  <div id="lockedWrap" style="margin-top:18px"></div>
</section>

<footer>
  <strong style="color:var(--ink)">このツールは試算用です。</strong>実際に適用されるプランは、ミサキカクが管理している集客データをもとに確定します。ここでの表示と食い違う場合は、ミサキカク側の数字が正となります。<br><br>
  金額はすべて税込です。源泉徴収（10.21%）は差し引かれていません。<br>
  ミサキカク
</footer>

</div>

<script>
/* ===================== 報酬ロジック ===================== */
// お客さま1人あたり、ミサキカクに実際に入る金額（黒字ライン算出用）。
// 会場2,800円・配信2,600円を2026年1〜9月の実績比（会場40.1%／配信59.9%）で平均し、
// 関係者割引・ショップカードの値引きと、配信手数料6%を引いたもの。
const NET_PER_GUEST = 2548;
const BROMIDE_UNIT = 220;
const TEAM_BONUS = 2200;
const TEAM_THRESHOLD = 50;
const BEST_BONUS = 1100;   // 自己ベスト更新（これまでの全出演の最高人数を超えたとき）。プラン1〜4のみ
// 出演者1人ぶんの枠でまかなう費用（2027年）。合計93,500円を4人で割ったもの。
// 会場31,000＋稽古場10,000＋人件費40,000＋当日スタッフ3,000＋台本印刷3,000＋打ち上げ平均4,500＋赤字補填2,000
const COST_PER_SLOT = 93500 / 4;

const PLANS = [
  { id:'first', label:'初回プラン', fee:3300, target:10,
    tiers:[{upTo:3, rate:0},{upTo:10, rate:660},{upTo:20, rate:880},{upTo:Infinity, rate:1100}],
    milestones:[],
    growth:false, memo:'参加費は3,300円です。3人目まではバックがなく、4人目から1人につき660円。<b>8人で参加費がゼロになり、10人集めるとプラスになります。</b>11人目からは880円、21人目からは1,100円と単価が上がります。' },
  { id:'p1', label:'プラン1', fee:6600, target:10,
    tiers:[{upTo:Infinity, rate:550}], milestones:[{at:3,amt:550},{at:5,amt:550},{at:10,amt:2200}],
    growth:true, memo:'1人につき550円。10人で参加費がゼロになります。' },
  { id:'p2', label:'プラン2', fee:9900, target:10,
    tiers:[{upTo:Infinity, rate:880}], milestones:[{at:5,amt:1760},{at:10,amt:3520}],
    growth:true, memo:'1人につき880円。8人まではプラン1と同じ結果。9人目からこちらが上回ります。10人で参加費がゼロになります。' },
  { id:'p3', label:'プラン3', fee:6600, target:15,
    tiers:[{upTo:Infinity, rate:1100}], milestones:[],
    growth:true, memo:'1人につき1,100円。何人でも単価は変わりません。' },
  { id:'p4', label:'プラン4', fee:9900, target:15,
    tiers:[{upTo:10, rate:1100},{upTo:Infinity, rate:1760}], milestones:[],
    growth:true, memo:'10人目までは1,100円、11人目からは1,760円。15人でプラン3と並び、16人目から上回ります。' },
  { id:'p5a', label:'プラン5A（定額）', fee:0, target:14,
    tiers:[], milestones:[], steps:[{at:0,amt:2200},{at:7,amt:4400},{at:14,amt:8800}],
    growth:false, memo:'参加費なし。金額は3段階です。14人以上で8,800円、7〜13人で4,400円、6人以下で2,200円。同じ段のなかでは何人集めても同額です。' },
  { id:'p5b', label:'プラン5B（定額）', fee:0, target:17,
    tiers:[], milestones:[], steps:[{at:0,amt:4400},{at:9,amt:8800},{at:17,amt:17600}],
    growth:false, memo:'参加費なし。金額は3段階です。17人以上で17,600円、9〜16人で8,800円、8人以下で4,400円。同じ段のなかでは何人集めても同額です。' },
  { id:'p5c', label:'プラン5C（定額）', fee:0, target:21,
    tiers:[], milestones:[], steps:[{at:0,amt:6600},{at:11,amt:13200},{at:21,amt:26400}],
    growth:false, memo:'参加費なし。金額は3段階です。21人以上で26,400円、11〜20人で13,200円、10人以下で6,600円。同じ段のなかでは何人集めても同額です。' },
  { id:'p6', label:'プラン6', fee:17600, target:0,
    tiers:[], milestones:[], growth:false,
    memo:'集客は問いません。参加費17,600円だけで出演できます。報酬はありません。' },
  { id:'p7', label:'プラン7', fee:0, target:5,
    tiers:[{upTo:Infinity, rate:880}], milestones:[{at:5,amt:4400}],
    growth:false, memo:'ミサキカクが指定したときだけ使います。出演者からは選べません。' },
];

function tierSum(tiers, n){
  let rest = n, prev = 0, sum = 0;
  for (const t of tiers){
    const span = Math.min(rest, t.upTo - prev);
    if (span <= 0) break;
    sum += span * t.rate;
    rest -= span; prev = t.upTo;
    if (rest <= 0) break;
  }
  return sum;
}

function calc(plan, o){
  const n = o.count ?? 0, bromide = o.bromide ?? 0, teamTotal = o.teamTotal ?? 0;
  const lines = [];

  // 定額プラン：帯ごとに定額（同じ段のなかでは人数が変わっても同額）
  if (plan.steps){
    let amt = 0, lo = 0;
    for (const st of plan.steps){ if (n >= st.at){ amt = st.amt; lo = st.at; } }
    const top = plan.steps[plan.steps.length - 1];
    const label = (lo === top.at) ? (top.at + '人以上（定額）') : (lo + '人以上の段（定額）');
    lines.push({ label: label, amount: amt });
    const br0 = bromide * BROMIDE_UNIT;
    if (br0 > 0) lines.push({ label:'ブロマイド ' + bromide + '枚', amount: br0 });
    let team0 = 0;
    if (teamTotal >= TEAM_THRESHOLD){ team0 = TEAM_BONUS; lines.push({ label:'公演全体' + TEAM_THRESHOLD + '人達成', amount: TEAM_BONUS }); }
    const gross0 = amt + br0 + team0;
    return { gross: gross0, fee: 0, net: gross0, lines };
  }

  const base = tierSum(plan.tiers, n);
  if (base > 0) lines.push({ label:'チケットバック', amount: base });
  let ms = 0;
  for (const m of plan.milestones){
    if (n >= m.at){ ms += m.amt; lines.push({ label: m.at + '人達成ボーナス', amount: m.amt }); }
  }
  const br = bromide * BROMIDE_UNIT;
  if (br > 0) lines.push({ label:'ブロマイド ' + bromide + '枚', amount: br });
  let gr = 0;
  if (plan.growth && o.best !== null && o.best !== undefined && n > o.best){
    gr += BEST_BONUS; lines.push({ label:'自己ベスト更新', amount: BEST_BONUS });
  }
  let team = 0;
  if (teamTotal >= TEAM_THRESHOLD){ team = TEAM_BONUS; lines.push({ label:'公演全体' + TEAM_THRESHOLD + '人達成', amount: TEAM_BONUS }); }
  const gross = base + ms + br + gr + team;
  if (plan.fee > 0) lines.push({ label:'参加費', amount: -plan.fee });
  return { gross, fee: plan.fee, net: gross - plan.fee, lines };
}

function eligibility(plan, history, isFirstTime){
  // 直近2回とも3人以下なら、プラン6のみ選べる（主催の損失を一定に抑えるための下限ルール）
  if (!isFirstTime && history.length >= 2 && history[0] <= 3 && history[1] <= 3){
    if (plan.id === 'p6') return { ok:true, why:'直近2回とも3人以下のため選べます' };
    return { ok:false, why:'直近2回とも3人以下のため、今回はプラン6のみ選べます' };
  }
  if (plan.id === 'first') return { ok: isFirstTime, why:'初参加の方のみ' };
  if (plan.id === 'p7')    return { ok: false, why:'ミサキカクが指定したときだけ' };
  if (plan.id === 'p6')    return { ok: !isFirstTime, why:'2回目以降ならどなたでも' };
  if (isFirstTime)         return { ok: false, why:'2回目から選べます' };
  if (!history.length)     return { ok: false, why:'前回の人数を入れてください' };

  const isFlat = plan.id === 'p5a' || plan.id === 'p5b' || plan.id === 'p5c';
  // プラン1〜4は実績1回でも判定できる（出演2回目の方のため）。プラン5A〜5C（定額）は2回分必要（出演3回目から）。
  const need = isFlat ? 2 : Math.min(2, history.length);
  const rec = history.slice(0, need);
  if (rec.length < need){
    return { ok:false, why:'出演' + need + '回分の記録がたまると判定できます' };
  }
  const span = rec.length === 1 ? '前回' : '直近' + rec.length + '回';
  const tomo = rec.length === 1 ? 'が' : 'とも';
  const highAll = rec.every(v => v >= 10);
  if (plan.id === 'p1' || plan.id === 'p2'){
    // プラン3・4の条件を満たさない場合の受け皿（判定に隙間を作らない）
    return { ok: !highAll, why: highAll ? span + tomo + '10人以上なので、プラン3・4へ' : (rec.length === 1 ? '前回が9人以下、かつ4人以上' : span + 'のどちらかまたは両方が9人以下、かつどちらかが4人以上') };
  }
  if (plan.id === 'p3' || plan.id === 'p4'){
    return { ok: highAll, why: highAll ? span + tomo + '10人以上' : span + (rec.length === 1 ? 'が10人以上必要' : 'とも10人以上が必要') };
  }
  const th = { p5a:14, p5b:17, p5c:21 }[plan.id];
  const ok = rec.every(v => v >= th);
  return { ok, why: ok ? '直近2回とも' + th + '人以上' : '直近2回とも' + th + '人以上が必要' };
}

// ミサキカクも黒字になる人数（主宰の人件費まで含めてまかなえるライン）。
// 達成ボーナスの節目で一時的に下回ることがあるため、「その人数以上なら必ず黒字」になる最小の人数を返す。
function organizerBreakEven(plan){
  let ok = null;
  for (let n = 80; n >= 0; n--){
    const net = calc(plan, {count:n}).net;
    if (NET_PER_GUEST * n - net - COST_PER_SLOT >= 0) ok = n; else break;
  }
  return ok;
}

// 報酬が次に増えるまでの人数（増えない場合は null）
function nextRise(plan, opts, from){
  const base = calc(plan, Object.assign({}, opts, { count:from })).net;
  for (let n = from + 1; n <= 80; n++){
    if (calc(plan, Object.assign({}, opts, { count:n })).net > base) return n - from;
  }
  return null;
}

// 定額プランが選べるようになるまでの最短出演回数
// （今後すべて th 人以上を出したと仮定し、直近2回の窓から th 未満の記録が抜けるまで）
function flatPlanETA(history, th){
  for (let k = 0; k <= 2; k++){
    if (k + history.length < 2) continue;        // 履歴2件に満たない
    const kept = history.slice(0, Math.max(0, 2 - k));  // 窓に残る過去の記録
    if (kept.every(v => v >= th)) return k;
  }
  return 2;
}

/* ===================== 画面 ===================== */
const $ = id => document.getElementById(id);
const yen = v => (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP') + '円';

const BAR_MIN = -20000, BAR_MAX = 55000;
const zeroPct = (0 - BAR_MIN) / (BAR_MAX - BAR_MIN) * 100;
const openSet = new Set();

function readState(){
  const isFirst = $('firstTime').checked;
  const h = ['h1','h2','h3'].map(id => {
    const v = $(id).value.trim();
    return v === '' ? null : Math.max(0, Math.min(60, parseInt(v, 10) || 0));
  });
  // 新しい順に、途中で空欄が出たらそこまでを出演履歴とみなす
  const history = [];
  if (!isFirst){ for (const v of h){ if (v === null) break; history.push(v); } }
  const prev = history.length ? history[0] : null;
  // 自己ベスト：入力欄の人数と、入力済みの出演履歴のうち、いちばん多い人数
  const bv = $('best').value.trim();
  const bestInput = (isFirst || bv === '') ? null : Math.max(0, Math.min(99, parseInt(bv, 10) || 0));
  const cands = history.slice();
  if (bestInput !== null && history.length) cands.push(bestInput);
  const best = cands.length ? Math.max.apply(null, cands) : null;
  return {
    isFirst, history,
    count: +$('count').value,
    bromide: +$('brOut').textContent,
    teamTotal: $('team').checked ? TEAM_THRESHOLD : 0,
    prev, best
  };
}

function render(){
  const s = readState();
  $('countTxt').textContent = s.count;
  $('histBox').classList.toggle('disabled', s.isFirst);
  $('bestBox').classList.toggle('disabled', s.isFirst);

  const opts = { count:s.count, bromide:s.bromide, teamTotal:s.teamTotal, prev:s.prev, best:s.best };
  const optsNext = Object.assign({}, opts, { count:s.count + 1 });

  const rows = PLANS.map(p => {
    const el = eligibility(p, s.history, s.isFirst);
    const r = calc(p, opts);
    const rn = calc(p, optsNext);
    return { p, el, net:r.net, lines:r.lines, delta: rn.net - r.net };
  });

  const open = rows.filter(r => r.el.ok).sort((a,b) => b.net - a.net);
  const shut = rows.filter(r => !r.el.ok);

  // --- プラン6のご案内
  const nt = $('notice');
  const forced = !s.isFirst && s.history.length >= 2 && s.history[0] <= 3 && s.history[1] <= 3;
  if (forced){
    nt.innerHTML =
      '<div class="notice"><div class="nt">今回はプラン6のみ選べます</div>' +
      '<p>直近2回とも3人以下でした。集客に向き合うのがしんどいときのための仕組みとして、' +
      '<b>参加費17,600円・集客は問わない</b>プラン6をご用意しています。<br>' +
      '次回、集客が4人以上に戻れば、またプラン1・2から選べます。</p></div>';
  } else if (!s.isFirst && s.history.length >= 1 && s.history[0] <= 3){
    nt.innerHTML =
      '<div class="notice"><div class="nt">次回も3人以下だと、プラン6のみになります</div>' +
      '<p>前回は' + s.history[0] + '人でした。もう1回3人以下が続くと、次回選べるプランがプラン6だけになります。</p></div>';
  } else {
    nt.innerHTML = '';
  }

  // --- 見出し
  const hl = $('headline');
  if (open.length){
    const top = open[0];
    const neg = top.net < 0;
    hl.className = 'headline' + (neg ? ' negative' : '');
    const toZero = neg ? nextZero(top.p, opts, s.count) : null;
    const obe = organizerBreakEven(top.p);
    const flatReached = top.p.steps && s.count >= top.p.steps[top.p.steps.length - 1].at;
    let stepLine = '';
    if (top.p.steps){
      const nx = top.p.steps.find(st => st.at > s.count);
      stepLine = nx
        ? 'あと <b>' + (nx.at - s.count) + '人</b> で <b>' + yen(nx.amt) + '</b> に上がります'
        : 'いちばん上の段です。<b>ここから先は同額</b>です';
    }
    const obeLine = obe === null ? '' :
      (s.count >= obe ? 'この人数だと、<b>ミサキカクも黒字</b>です' : 'あと <b>' + (obe - s.count) + '人</b> で、ミサキカクも黒字になります');
    hl.innerHTML =
      '<div class="cap">いま いちばん高いプラン</div>' +
      '<div class="plan">' + top.p.label + '</div>' +
      '<div class="amt">' + yen(top.net) + '</div>' +
      '<div class="next">' +
      (top.p.steps ? stepLine
        : (top.p.id === 'p6' ? '集客に関わらず<b>同額</b>です'
          : (top.delta > 0 ? 'あと1人で <b>' + yen(top.delta) + '</b> 増えます'
            : (function(){ const k = nextRise(top.p, opts, s.count); return k ? 'あと <b>' + k + '人</b> で報酬が増えはじめます' : ''; })()))) +
      (toZero ? '<br>あと <b>' + toZero + '人</b> でマイナスがなくなります' : '') +
      (obeLine ? '<br>' + obeLine : '') +
      '</div>';
  } else {
    hl.className = 'headline';
    hl.innerHTML = '<div class="cap">選べるプランがありません</div><div class="next" style="margin-top:8px">出演履歴を入力してください</div>';
  }

  // --- プラン一覧
  $('plans').innerHTML = open.map((r, i) => planCard(r, i === 0, s.count, opts)).join('') ||
    '<p style="color:var(--dim);font-size:13px">条件に合うプランがありません。</p>';

  // --- 選べないプラン
  $('lockedWrap').innerHTML = shut.length
    ? '<div class="sec-title">いまは選べないプラン</div>' + shut.map(r =>
        '<div class="locked"><span class="n">' + r.p.label + '</span><span class="r">' + r.el.why + '</span></div>').join('')
    : '';

  document.querySelectorAll('.plan-head').forEach(h => {
    h.addEventListener('click', () => {
      const id = h.dataset.id;
      openSet.has(id) ? openSet.delete(id) : openSet.add(id);
      h.parentElement.classList.toggle('open');
    });
  });
}

function nextZero(plan, opts, from){
  for (let n = from + 1; n <= 60; n++){
    if (calc(plan, Object.assign({}, opts, { count:n })).net >= 0) return n - from;
  }
  return null;
}

function planCard(r, isTop, count, opts){
  const neg = r.net < 0;
  const pct = v => (Math.max(BAR_MIN, Math.min(BAR_MAX, v)) - BAR_MIN) / (BAR_MAX - BAR_MIN) * 100;
  const end = pct(r.net);
  const left = Math.min(end, zeroPct), width = Math.max(0.6, Math.abs(end - zeroPct));
  const isOpen = openSet.has(r.p.id);
  const tgt = r.p.target > 0 ? '目標 ' + r.p.target + '人' : '目標なし';

  const obe = organizerBreakEven(r.p);
  const obeLine = obe === null ? '' :
    (count >= obe ? 'この人数だと、ミサキカクも黒字です。' : 'あと' + (obe - count) + '人で、ミサキカクも黒字になります。');

  const detail = r.lines.map(l =>
    '<div class="dl-row' + (l.amount < 0 ? ' minus' : '') + '"><span>' + l.label + '</span><span>' + yen(l.amount) + '</span></div>'
  ).join('') +
    '<div class="dl-row total"><span>受け取る金額</span><span>' + yen(r.net) + '</span></div>' +
    '<p class="memo">' + r.p.memo + (obeLine ? '<br>' + obeLine : '') + '</p>';

  let nextTxt;
  if (r.p.steps){
    const nx = r.p.steps.find(st => st.at > count);
    nextTxt = nx ? 'あと' + (nx.at - count) + '人で ' + yen(nx.amt) : '最上段・以降同額';
  } else if (r.p.id === 'p6'){
    nextTxt = '集客に関わらず同額';
  } else if (r.delta > 0){
    nextTxt = 'あと1人 +' + yen(r.delta);
  } else {
    const k = nextRise(r.p, opts, count);
    nextTxt = k ? 'あと' + k + '人で増えはじめます' : '';
  }

  return '<div class="plan' + (isTop ? ' top' : '') + (isOpen ? ' open' : '') + '">' +
    '<div class="plan-head" data-id="' + r.p.id + '">' +
      '<span class="plan-name">' + r.p.label + (isTop ? '<span class="plan-tag">いちばん高い</span>' : '') + '</span>' +
      '<span class="plan-amt' + (neg ? ' neg' : '') + '">' + yen(r.net) + '</span>' +
    '</div>' +
    '<div class="bar-track"><div class="bar-zero" style="left:' + zeroPct + '%"></div>' +
      '<div class="bar-fill ' + (neg ? 'neg' : 'pos') + '" style="left:' + left + '%;width:' + width + '%"></div></div>' +
    '<div class="plan-sub"><span>' + tgt + '</span>' +
      '<span class="plan-next' + (neg ? ' neg' : '') + '">' + nextTxt + '</span></div>' +
    '<div class="detail">' + detail + '</div>' +
  '</div>';
}

/* --- 履歴の説明文 --- */
function histNote(){
  const s = readState();
  const t = $('histNote');
  if (s.isFirst){ t.innerHTML = '初参加の方は<b>初回プラン</b>になります。参加費は3,300円で、<b>8人でゼロ、10人集めるとプラス</b>になります。今日の人数で、2回目に選べるプランが決まります。'; return; }
  const h = s.history;
  if (!h.length){ t.textContent = '前回の人数を入れてください。'; return; }
  const nth = h.length >= 3 ? '4回目以降' : (h.length + 1) + '回目';

  // プラン6強制の対象なら、この一言だけにして矛盾を出さない
  if (h.length >= 2 && h[0] <= 3 && h[1] <= 3){
    t.innerHTML = '今回は<b>' + nth + '</b>の出演です。直近2回とも3人以下のため、<b>プラン6</b>のみ選べます。';
    return;
  }

  const rec = h.slice(0, Math.min(2, h.length));
  const span = rec.length === 1 ? '前回' : '直近2回';
  const tomo = rec.length === 1 ? 'が' : 'とも';
  const line = rec.every(v => v >= 10)
    ? span + tomo + '10人以上なので、<b>プラン3・4</b>が選べます。'
    : (rec.length === 1 ? '前回が9人以下なので、<b>プラン1・2</b>から選びます。' : span + 'のどちらかまたは両方が9人以下なので、<b>プラン1・2</b>から選びます。');

  // 定額プランのうち、実際に選べるものを列挙する
  const flatIds = [['p5a','5A'], ['p5b','5B'], ['p5c','5C']];
  const openable = flatIds.filter(([id]) => eligibility(PLANS.find(p => p.id === id), h, false).ok);
  let gyara;
  if (openable.length){
    gyara = '<br>' + openable.map(x => 'プラン' + x[1] + '（定額）').join('・') + 'も選べます。';
  } else {
    const eta = flatPlanETA(h, 14);
    gyara = eta === 0 ? ''
      : '<br>プラン5A〜5C（定額）は、毎回14人以上を続ければ最短で<b>あと' + eta + '回</b>の出演から選べます。';
  }
  const bestLine = s.best === null ? ''
    : '<br>自己ベストは<b>' + s.best + '人</b>として計算します。これを超えると、プラン1〜4では+1,100円です。';
  t.innerHTML = '今回は<b>' + nth + '</b>の出演です。' + line + gyara + bestLine;
}

/* --- 操作 --- */
function clamp(el, min, max){
  if (el.value.trim() === '') return; // 空欄はそのまま（0に戻さない）
  el.value = Math.max(min, Math.min(max, +el.value || 0));
}
$('count').addEventListener('input', render);
$('minus').addEventListener('click', () => { const c=$('count'); c.value = Math.max(0, +c.value - 1); render(); });
$('plus').addEventListener('click',  () => { const c=$('count'); c.value = Math.min(40, +c.value + 1); render(); });
$('brMinus').addEventListener('click', () => { const o=$('brOut'); o.textContent = Math.max(0, +o.textContent - 1); render(); });
$('brPlus').addEventListener('click',  () => { const o=$('brOut'); o.textContent = Math.min(50, +o.textContent + 1); render(); });
$('team').addEventListener('change', render);
$('firstTime').addEventListener('change', () => { histNote(); render(); });
['h1','h2','h3'].forEach(id => $(id).addEventListener('input', () => { histNote(); render(); }));
['h1','h2','h3'].forEach(id => $(id).addEventListener('blur', e => { clamp(e.target, 0, 60); histNote(); render(); }));
$('best').addEventListener('input', () => { histNote(); render(); });
$('best').addEventListener('blur', e => { clamp(e.target, 0, 99); histNote(); render(); });
$('histReset').addEventListener('click', () => {
  ['h1','h2','h3'].forEach(id => $(id).value = '');
  $('best').value = '';
  $('firstTime').checked = false;
  histNote(); render();
});

histNote();
render();
</script>
